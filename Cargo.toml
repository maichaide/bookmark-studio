[package]
name = "bookmark-studio"
version = "0.1.0"
edition = "2021"
description = "Cross-platform offline browser bookmark manager"
license = "MIT"

[dependencies]
eframe = { version = "0.29", default-features = true }
egui = "0.29"
egui_extras = "0.29"
rfd = "0.15"
kuchiki = "0.8"
serde = { version = "1", features = ["derive"] }
pinyin = "0.10"
url = "2"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
